[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "creamy-keys"
dynamic = ["version"]
description = "Make every key on your computer sound like a creamy mechanical keyboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["numpy", "sounddevice", "pynput"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
creamy-keys = "creamy_keys.__main__:main"

[tool.setuptools]
packages = ["creamy_keys"]

[tool.setuptools.package-data]
creamy_keys = ["sounds/*/*"]

[tool.setuptools.dynamic]
version = { attr = "creamy_keys.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
